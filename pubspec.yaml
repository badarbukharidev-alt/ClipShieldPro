name: clipshield
description: "ClipShield Pro: AI-powered on-device YouTube short clipper and video copyright bypass utility."
publish_to: 'none'

version: 1.2.0+3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  
  # Downloader & Transcripts
  youtube_explode_dart: ^2.3.0
  
  # Media Processing & Analysis
  ffmpeg_kit_flutter_new: ^4.6.2
  google_mlkit_face_detection: ^0.12.0
  
  # Network & Storage
  dio: ^5.4.0
  path_provider: ^2.1.2
  shared_preferences: ^2.2.2
  uuid: ^4.3.3
  share_plus: ^7.2.1
  file_picker: ^8.0.0
  intl: ^0.19.0
  path: ^1.9.0

  # Background Service
  flutter_foreground_task: ^3.8.0

  # UI & Video Playback
  video_player: ^2.8.2
  chewie: ^1.8.1

  # Permissions & System Integrations
  permission_handler: ^11.3.1
  url_launcher: ^6.3.0
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

dependency_overrides:
  package_info_plus: 8.3.1
  wakelock_plus: 1.2.8

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
